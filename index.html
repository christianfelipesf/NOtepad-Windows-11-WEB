<body>
<div class="strip"><div class="app-icon"><img src="icons/icon.svg" alt="" width="16" height="16"></div><div class="tabs" id="tabs"></div><button class="newtab" id="btnNewTab" title="Nova guia (Ctrl+T)">+</button><button class="newtab" id="btnAllTabs" title="Listar todas as guias">▾</button><div class="drag"></div></div>
<div class="menubar"><button class="mi" data-m="file">Arquivo</button><button class="mi" data-m="edit">Editar</button><button class="mi" data-m="view">Exibir</button><button class="gear" id="btnSettings" title="Configurações"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 5.5A2.5 2.5 0 1 0 8 10.5 2.5 2.5 0 0 0 8 5.5zm6.3 2.5-.9.7c.03.22.03.46 0 .68l.9.7-.7 1.2-1.05-.2c-.18.16-.39.29-.61.38l-.2 1.05h-1.4l-.2-1.05a2.9 2.9 0 0 1-.61-.38l-1.05.2-.7-1.2.9-.7a1.9 1.9 0 0 1 0-.68l-.9-.7.7-1.2 1.05.2c.18-.16.39-.29.61-.38l.2-1.05h-1.4l.2 1.05c-.22.09-.43.22-.61.38l-1.05-.2-.7 1.2z" transform="translate(-1.3,-1.5) scale(1.05)"/></svg></button>
<div class="menu" id="menu-file"></div><div class="menu" id="menu-edit"></div><div class="menu" id="menu-view"></div><div class="menu" id="menu-settings" style="right:8px;left:auto"></div>
</div>
<div class="mdbar" id="mdbar"><button class="b" onclick="mdFmt('bold')" title="Negrito">N</button><button class="i" onclick="mdFmt('italic')" title="Itálico">I</button><button onclick="mdFmt('strike')" title="Tachado"><s>S</s></button><button onclick="mdFmt('code')" title="Código">&lt;&gt;</button><span class="sep"></span><button onclick="mdFmt('h1')" title="Título 1">T1</button><button onclick="mdFmt('h2')" title="Título 2">T2</button><button onclick="mdFmt('h3')" title="Título 3">T3</button><span class="sep"></span><button onclick="mdFmt('ul')" title="Lista">• Lista</button><button onclick="mdFmt('ol')" title="Lista numerada">1. Lista</button><button onclick="mdFmt('quote')" title="Citação">❝</button><button onclick="mdFmt('link')" title="Link">Link</button></div>
<div class="editor-wrap"><textarea id="editor" spellcheck="false"></textarea><div id="preview"></div>
<div class="small-find" id="findBox"><div class="field" style="margin:0"><label>Localizar</label><input type="text" id="findText"></div><div class="frow"><button class="btn" id="findUp">&#8592;</button><button class="btn" id="findDown">&#8594;</button><button class="btn primary" id="findClose">Fechar</button></div><div class="check"><input type="checkbox" id="findCase"><label for="findCase">Diferenciar maiúsc./minúsc.</label></div><div class="check"><input type="checkbox" id="findWrap" checked><label for="findWrap">Continuar do início/fim</label></div></div>
<div class="small-find" id="replaceBox"><div class="field" style="margin:0"><label>Localizar</label><input type="text" id="repFind"></div><div class="field"><label>Substituir por</label><input type="text" id="repBy"></div><div class="frow"><button class="btn" id="repOne">Substituir</button><button class="btn" id="repAll">Tudo</button><button class="btn" id="repDown">&#8594;</button><button class="btn primary" id="repClose">Fechar</button></div><div class="check"><input type="checkbox" id="repCase"><label for="repCase">Diferenciar maiúsc./minúsc.</label></div></div>
</div>
<div class="statusbar" id="statusbar"><span class="st" id="stPos">Ln 1, Col 1</span><span class="st" id="stChars">0 caracteres</span><span class="st" id="stLines" title="Total de linhas (clique para ir para a linha)">1 linha</span><span class="st clickable" id="stDates" title="Criação e última edição">—</span><span class="st" id="stMsg"></span><span class="st clickable" id="stTheme" title="Clique para trocar de tema">Tema: Escuro</span><span class="st clickable" id="stMd" title="Prévia Markdown">MD</span><span class="st clickable" id="stZoom">100%</span><span class="st clickable" id="stEol">Windows (CRLF)</span><span class="st clickable" id="stEnc">UTF-8</span></div>
<div class="overlay" id="ovl"><div class="dlg" id="dlgBox"></div></div>
<div class="ctx" id="ctx"></div>
<input type="file" id="fileInput" style="display:none" multiple>
<input type="file" id="zipInput" accept=".zip,application/zip" style="display:none">
